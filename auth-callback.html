<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrindo Sabina…</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FFFFFF;
      color: #1A1714;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo {
      height: 32px;
      margin: 0 auto 32px;
      display: block;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #8C8680;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #8C8680;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 100px;
      background: #1A1714;
      color: #F7F4EF;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .hint {
      display: block;
      margin-top: 20px;
      font-size: 12px;
      color: #B8B1A6;
      letter-spacing: 0.04em;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(26,23,20,0.12);
      border-top-color: #1A1714;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo-dark.png" alt="Sabina" />
    <div class="spinner" id="spinner"></div>
    <p class="eyebrow">RECUPERAÇÃO DE SENHA</p>
    <h1>Abrindo o app Sabina…</h1>
    <p>Se nada acontecer em alguns segundos, toque no botão abaixo.</p>
    <a id="deepLink" class="btn" href="#">Abrir no app Sabina</a>
    <span class="hint">Não tem o app? <a href="index.html" style="color:#1A1714;text-decoration:underline;">Voltar para a página inicial</a></span>
  </div>

  <script>
    (function () {
      // Repassa todos os query params + hash params do email pro deep link
      // Supabase usa PKCE → ?code=... ou implicit → #access_token=...
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var combined = '';
      if (search.length > 1) combined = search.substring(1);
      if (hash.length > 1) {
        combined = combined ? combined + '&' + hash.substring(1) : hash.substring(1);
      }
      var deepLink = 'sabina://auth-callback' + (combined ? '?' + combined : '');

      var btn = document.getElementById('deepLink');
      btn.href = deepLink;

      // Tenta abrir automaticamente
      setTimeout(function () {
        window.location.href = deepLink;
      }, 250);
    })();
  </script>
</body>
</html>
